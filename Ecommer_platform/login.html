<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <style>
        :root {
            font-family: Inter, system-ui, sans-serif;
            color-scheme: light;
            background: #eef2f7;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #f8fbff 0%, #eef2f7 100%);
        }
        .login-shell {
            width: min(420px, calc(100% - 32px));
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }
        .hero {
            padding: 36px 32px 24px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
        }
        .hero h1 {
            margin: 0 0 8px;
            font-size: clamp(1.9rem, 4vw, 2.4rem);
            line-height: 1.1;
        }
        .hero p {
            margin: 0;
            color: rgba(255, 255, 255, 0.85);
            max-width: 28rem;
            font-size: 0.96rem;
        }
        .login-panel {
            padding: 32px;
            display: grid;
            gap: 18px;
        }
        .form-group {
            display: grid;
            gap: 10px;
        }
        label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1f2937;
        }
        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .helper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: #475569;
        }
        .helper a {
            color: #2563eb;
            text-decoration: none;
        }
        .helper a:hover {
            text-decoration: underline;
        }
        .cta {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 700;
            background: #2563eb;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .cta:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 12px 20px rgba(37, 99, 235, 0.15);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #64748b;
            font-size: 0.9rem;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .secondary-action {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 14px 16px;
            background: white;
            color: #0f172a;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .secondary-action:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }
        .status {
            display: none;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            color: #0f172a;
            background: #ecfeff;
            border: 1px solid #67e8f9;
        }
        .status.error {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        .status.visible {
            display: block;
        }
        .note {
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.6;
        }
        @media (max-width: 480px) {
            .hero {
                padding: 28px 24px 20px;
            }
            .login-panel {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell" aria-label="User login">
        <section class="hero">
            <h1>Welcome back</h1>
            <p>Sign in to access your dashboard, manage orders, and keep your e-commerce store running smoothly.</p>
        </section>

        <section class="login-panel">
            <div id="statusMessage" class="status" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" minlength="6">
                </div>

                <div class="helper">
                    <label><input type="checkbox" id="remember" name="remember"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="cta">Log in</button>
            </form>

            <div class="divider">Or continue with</div>

            <button type="button" class="secondary-action">Continue withFacebook</button>
            <p class="note">No account yet? <a href="#">Create one</a> and start selling today.</p>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById('loginForm');
        const statusMessage = document.getElementById('statusMessage');

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            statusMessage.className = 'status visible';

            const email = loginForm.email.value.trim();
            const password = loginForm.password.value.trim();

            if (!email || !password) {
                statusMessage.textContent = 'Please enter both your email and password.';
                statusMessage.classList.add('error');
                return;
            }

            statusMessage.textContent = 'Signing in...';
            statusMessage.classList.remove('error');

            setTimeout(() => {
                if (email.toLowerCase() === 'admin@example.com' && password === 'password123') {
                    statusMessage.textContent = 'Login successful! Redirecting...';
                    statusMessage.classList.remove('error');
                } else {
                    statusMessage.textContent = 'Unable to sign in. Check your credentials and try again.';
                    statusMessage.classList.add('error');
                }
            }, 900);
        });
    </script>
</body>
</html>
