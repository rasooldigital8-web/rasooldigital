<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        :root {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color-scheme: light;
            background: #eef2f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f8fbff 0%, #eef2f7 100%);
            padding: 24px;
        }

        .signup-shell {
            width: min(460px, 100%);
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .hero {
            padding: 32px 32px 20px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 3.5vw, 2.3rem);
        }

        .hero p {
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
        }

        .form-panel {
            padding: 28px 32px 32px;
            display: grid;
            gap: 16px;
        }

        .status {
            display: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            border: 1px solid #8dd3ff;
            background: #ecfeff;
            color: #0f172a;
        }

        .status.visible {
            display: block;
        }

        .status.error {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }

        .form-group {
            display: grid;
            gap: 8px;
        }

        label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1f2937;
        }

        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 13px 14px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.92rem;
            color: #475569;
        }

        .cta {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 700;
            background: #2563eb;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .cta:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 12px 20px rgba(37, 99, 235, 0.15);
        }

        .footer-note {
            font-size: 0.95rem;
            color: #64748b;
            text-align: center;
            margin: 0;
        }

        .footer-note a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .hero, .form-panel {
                padding-left: 24px;
                padding-right: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="signup-shell" aria-label="Create account form">
        <section class="hero">
            <h1>Create account</h1>
            <p>Join our ecommerce platform to manage orders, products, and customers in one place.</p>
        </section>

        <section class="form-panel">
            <div id="statusMessage" class="status" role="alert"></div>

            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email ">Email address </label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the terms and privacy policy</label>
                </div>

                <button type="submit" class="cta">Create account</button>
            </form>

            <p class="footer-note">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <script>
        const signupForm = document.getElementById('signupForm');
        const statusMessage = document.getElementById('statusMessage');

        signupForm.addEventListener('submit', (event) => {
            event.preventDefault();
            statusMessage.className = 'status visible';

            const fullName = signupForm.fullName.value.trim();
            const email = signupForm.email.value.trim();
            const password = signupForm.password.value.trim();
            const confirmPassword = signupForm.confirmPassword.value.trim();
            const termsAccepted = signupForm.terms.checked;

            if (!fullName || !email || !password || !confirmPassword) {
                statusMessage.textContent = 'Please fill in all the required fields.';
                statusMessage.classList.add('error');
                return;
            }

            if (password.length < 6) {
                statusMessage.textContent = 'Password must be at least 6 characters long.';
                statusMessage.classList.add('error');
                return;
            }

            if (password !== confirmPassword) {
                statusMessage.textContent = 'Passwords do not match. Please try again.';
                statusMessage.classList.add('error');
                return;
            }

            if (!termsAccepted) {
                statusMessage.textContent = 'Please accept the terms and privacy policy.';
                statusMessage.classList.add('error');
                return;
            }

            statusMessage.textContent = 'Account created successfully! You can now log in.';
            statusMessage.classList.remove('error');
        });
    </script>
</body>
</html>
