<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is the first lesson of MERN</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #87cefa, #d6f3ff);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: #1f3d5a;
            line-height: 1.2;
        }

        h4 {
            margin: 0;
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: #4f5d75;
        }

        @media screen and (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px 12px;
                border-radius: 12px;
            }
        }
    </style>
   
</head>
<body>
    <div class="container">
        <h1>Well Come to all my members</h1>
        <h4>Thank you!</h4>
    </div>
</body>
</html>
